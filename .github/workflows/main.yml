name: Auto Sync and Patch
on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight UTC
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  sync-and-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Sync and Patch package.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 1. Fetch the latest official Umami code
          git remote add upstream https://github.com/umami-software/umami.git
          git fetch upstream
          
          # 2. Merge it. If there is a conflict, automatically accept Umami's version
          git merge upstream/master -X theirs --no-edit
          
          # 3. Use 'jq' to safely target and overwrite our specific build script
          jq '.scripts.build = "npm-run-all check-env build-db build-tracker build-geo build-app"' package.json > package.tmp.json
          mv package.tmp.json package.json
          
          # 4. Stage the patched file
          git add package.json
          
          # 5. Commit only if changes were actually made
          if ! git diff --cached --quiet; then
            git commit -m "Auto-patched package.json to remove check-db step"
          fi
          
          # 6. Push the final version to your repository
          git push origin master
